<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="rfFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16a34a" stop-opacity="0.12"/><stop offset="100%" stop-color="#16a34a" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="s10Fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="rlFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626" stop-opacity="0.12"/><stop offset="100%" stop-color="#dc2626" stop-opacity="0.03"/></linearGradient>
    <marker id="a-blk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0b0b0b" fill-opacity="0.7"/></marker>
    <marker id="a-grn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="a-blu" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="800" height="1800" fill="#fcfcfb" rx="4"/>

  <!-- ====== 标题 ====== -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0b0b0b">circRNA 3D 结构预测 — 串联架构</text>
  <text x="400" y="50" text-anchor="middle" font-size="10" fill="#52514e">RhoFold+ RNA FM 编码器 (冻结) → S10 等变解码器 (可训练)</text>

  <!-- ====== 输入 ====== -->
  <rect x="250" y="75" width="300" height="40" rx="6" fill="#fff" stroke="#0b0b0b" stroke-opacity="0.3"/>
  <text x="400" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">circRNA 序列 seq_tokens (B, L)</text>

  <line x1="400" y1="115" x2="400" y2="140" stroke="#0b0b0b" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#a-blk)"/>

  <!-- ====== RhoFold+ 编码器 (绿色) ====== -->
  <rect x="150" y="145" width="500" height="110" rx="8" fill="url(#rfFill)" stroke="#16a34a" stroke-opacity="0.6" stroke-width="1.4"/>
  <text x="400" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">RhoFold+ RNA FM Encoder (冻结)</text>

  <rect x="170" y="180" width="220" height="60" rx="4" fill="#fff" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="280" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">12 层 Transformer</text>
  <text x="280" y="212" text-anchor="middle" font-size="7" fill="#52514e">d=640, 99.5M 参数</text>
  <text x="280" y="226" text-anchor="middle" font-size="7" fill="#16a34a">冻结前 9 层, 后 3 层可训练</text>

  <rect x="410" y="180" width="220" height="60" rx="4" fill="#fff" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="520" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">输出</text>
  <text x="520" y="212" text-anchor="middle" font-size="7" fill="#52514e">node_repr (B, L, 640)</text>
  <text x="520" y="226" text-anchor="middle" font-size="7" fill="#52514e">pair_repr (B, L, L, 128)</text>

  <line x1="400" y1="255" x2="400" y2="280" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-grn)"/>

  <!-- ====== 投影层 ====== -->
  <rect x="200" y="285" width="400" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.4"/>
  <text x="400" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">rhofold_proj: Linear(640→256) + LayerNorm + GELU</text>

  <line x1="400" y1="321" x2="400" y2="345" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blu)"/>

  <!-- ====== S10 等变解码器 (蓝色) ====== -->
  <rect x="80" y="350" width="640" height="520" rx="8" fill="url(#s10Fill)" stroke="#2563eb" stroke-opacity="0.6" stroke-width="1.4"/>
  <text x="400" y="373" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">S10 等变解码器 (可训练)</text>

  <!-- Step 1: EquivariantGNNLayer ×4 -->
  <rect x="100" y="388" width="600" height="56" rx="5" fill="#fff" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="400" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">[1] EquivariantGNNLayer ×4</text>
  <text x="400" y="424" text-anchor="middle" font-size="7" fill="#52514e">SparseSO2SteerableKernel + CircularRelativePositionBias</text>
  <text x="400" y="438" text-anchor="middle" font-size="7" fill="#2563eb">输出: node_repr_inv (B,L,128) + node_repr_eq (B,L,64,2)</text>

  <line x1="400" y1="444" x2="400" y2="460" stroke="#2563eb" stroke-width="1" marker-end="url(#a-blu)"/>

  <!-- Step 2: S8 Refine -->
  <rect x="100" y="462" width="600" height="40" rx="5" fill="#fff" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="400" y="480" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">[2] SparseEquivariantS8Refine</text>
  <text x="400" y="496" text-anchor="middle" font-size="7" fill="#52514e">2 层稀疏等变注意力: inv→attention权重, eq→value+output (保持等变性)</text>

  <line x1="400" y1="502" x2="400" y2="518" stroke="#2563eb" stroke-width="1" marker-end="url(#a-blu)"/>

  <!-- Step 3: Latent -->
  <rect x="100" y="520" width="600" height="40" rx="5" fill="#fff" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="400" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">[3] StrictlyEquivariantLatent</text>
  <text x="400" y="554" text-anchor="middle" font-size="7" fill="#52514e">inv: MLP (128→64) | eq: SO2Linear (64→32) | L&gt;1000: 自动多尺度</text>

  <line x1="400" y1="560" x2="400" y2="580" stroke="#2563eb" stroke-width="1" marker-end="url(#a-blu)"/>

  <text x="400" y="576" text-anchor="middle" font-size="7" fill="#52514e">→ latent_inv (B,L,64) + latent_eq (B,L,32,2)</text>

  <!-- Step 4: CoordDiffusion (重点) -->
  <rect x="100" y="586" width="600" height="140" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/>
  <text x="400" y="606" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">[4] CoordDiffusion.generate()</text>
  <text x="400" y="622" text-anchor="middle" font-size="7" fill="#52514e">x_T ~ N(0,I) → DDIM 100 步去噪</text>

  <rect x="120" y="632" width="180" height="40" rx="3" fill="#fff" stroke="#2563eb" stroke-opacity="0.2"/>
  <text x="210" y="648" text-anchor="middle" font-size="7" fill="#52514e">SO2EquivariantLinear</text>
  <text x="210" y="662" text-anchor="middle" font-size="7" fill="#52514e">坐标 xy 等变嵌入 + MLP z</text>

  <rect x="310" y="632" width="180" height="40" rx="3" fill="#fff" stroke="#2563eb" stroke-opacity="0.2"/>
  <text x="400" y="648" text-anchor="middle" font-size="7" fill="#52514e">cond_proj_inv/eq</text>
  <text x="400" y="662" text-anchor="middle" font-size="7" fill="#52514e">+ 时间嵌入 → MLP denoiser</text>

  <rect x="500" y="632" width="180" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-opacity="0.4"/>
  <text x="590" y="648" text-anchor="middle" font-size="8" font-weight="600" fill="#1e3a8a">MixedHybridAttention</text>
  <text x="590" y="662" text-anchor="middle" font-size="7" fill="#1d4ed8">DynamicAnchor (奇数层)</text>

  <line x1="400" y1="672" x2="400" y2="692" stroke="#2563eb" stroke-width="0.8" marker-end="url(#a-blu)"/>

  <text x="400" y="690" text-anchor="middle" font-size="7" fill="#52514e">Dynamic Anchor: A=max(128, L*0.1) | SlidingWindow (偶数层)</text>

  <line x1="400" y1="698" x2="400" y2="718" stroke="#2563eb" stroke-width="0.8" marker-end="url(#a-blu)"/>

  <text x="400" y="716" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">输出: pred_coords (B, L, 3)</text>

  <!-- Step 5: Physics Refine -->
  <rect x="100" y="736" width="600" height="44" rx="5" fill="#fff" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="400" y="756" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">[5] physics_refine (Adam 100 步)</text>
  <text x="400" y="772" text-anchor="middle" font-size="7" fill="#52514e">立体化学能量 (bond/angle/clash/dihedral) + bond 投影到 5.9A</text>

  <line x1="400" y1="780" x2="400" y2="810" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blu)"/>

  <!-- ====== 输出 ====== -->
  <rect x="200" y="815" width="400" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/>
  <text x="400" y="840" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">CG 3-bead 坐标 (B, L, 3)</text>

  <line x1="400" y1="855" x2="400" y2="885" stroke="#0b0b0b" stroke-opacity="0.6" stroke-width="2" marker-end="url(#a-blk)"/>

  <!-- ====== BSJ 评估 ====== -->
  <rect x="200" y="890" width="400" height="44" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="400" y="910" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">BSJ 评估</text>
  <text x="400" y="926" text-anchor="middle" font-size="7" fill="#52514e">closure_dist = ||P_0 - P_L|| | bsj_conf = exp(-dist/10)</text>

  <line x1="400" y1="934" x2="400" y2="960" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <text x="400" y="955" text-anchor="middle" font-size="7" fill="#dc2626">quality_score &lt; 阈值 → RL-MCTS (可选)</text>

  <!-- ====== RL-MCTS 后优化 (可选) ====== -->
  <rect x="80" y="970" width="640" height="120" rx="8" fill="url(#rlFill)" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="400" y="992" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">RL-MCTS 后优化 (可选)</text>

  <rect x="100" y="1002" width="140" height="40" rx="3" fill="#fff" stroke="#dc2626" stroke-opacity="0.3"/>
  <text x="170" y="1018" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">策略网络</text>
  <text x="170" y="1032" text-anchor="middle" font-size="7" fill="#52514e">Encoder → logits</text>

  <rect x="260" y="1002" width="140" height="40" rx="3" fill="#fff" stroke="#dc2626" stroke-opacity="0.3"/>
  <text x="330" y="1018" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">块移动</text>
  <text x="330" y="1032" text-anchor="middle" font-size="7" fill="#52514e">rotation + translate</text>

  <rect x="420" y="1002" width="140" height="40" rx="3" fill="#fff" stroke="#dc2626" stroke-opacity="0.3"/>
  <text x="490" y="1018" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">MCTS 100 次</text>
  <text x="490" y="1032" text-anchor="middle" font-size="7" fill="#52514e">UCB1 c=1.414</text>

  <rect x="580" y="1002" width="140" height="40" rx="3" fill="#fff" stroke="#dc2626" stroke-opacity="0.3"/>
  <text x="650" y="1018" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">奖励</text>
  <text x="650" y="1032" text-anchor="middle" font-size="7" fill="#52514e">-Δenergy + closure</text>

  <text x="400" y="1068" text-anchor="middle" font-size="7" fill="#dc2626">200 iterations | segment_size=max(10,L//10) | REST2 副本交换 (可选)</text>

  <line x1="400" y1="1090" x2="400" y2="1120" stroke="#0b0b0b" stroke-opacity="0.6" stroke-width="2" marker-end="url(#a-blk)"/>

  <!-- ====== 最终输出 ====== -->
  <rect x="200" y="1125" width="400" height="40" rx="6" fill="#fff" stroke="#0b0b0b" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="400" y="1150" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">circRNA 3D 结构 (PDB)</text>

  <!-- ====== 架构总结 ====== -->
  <rect x="80" y="1190" width="640" height="180" rx="6" fill="#f9fafb" stroke="#e5e5e5"/>
  <text x="400" y="1212" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">串联架构总结</text>

  <rect x="100" y="1222" width="300" height="140" rx="5" fill="#fff" stroke="#16a34a" stroke-opacity="0.3"/>
  <text x="250" y="1240" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">RhoFold+ 编码器 (冻结)</text>
  <text x="110" y="1258" font-size="7" fill="#52514e">12 层 Transformer, d=640</text>
  <text x="110" y="1272" font-size="7" fill="#52514e">99.5M 参数, 冻结前 9 层</text>
  <text x="110" y="1286" font-size="7" fill="#52514e">输出: node_repr + pair_repr</text>
  <text x="110" y="1304" font-size="7" fill="#15803d">新增: rhofold_proj (640→256)</text>
  <text x="110" y="1318" font-size="7" fill="#52514e">文件: rhofold_backbone.py</text>
  <text x="110" y="1332" font-size="7" fill="#52514e">类: RhoFoldBackbone</text>
  <text x="110" y="1346" font-size="7" fill="#15803d">唯一新增参数: 640×256+256 = 164K</text>

  <rect x="420" y="1222" width="280" height="140" rx="5" fill="#fff" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="560" y="1240" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">S10 等变解码器 (可训练)</text>
  <text x="430" y="1258" font-size="7" fill="#52514e">EquivariantGNNLayer ×4</text>
  <text x="430" y="1272" font-size="7" fill="#52514e">S8Refine → Latent</text>
  <text x="430" y="1286" font-size="7" fill="#52514e">CoordDiffusion (DDIM 100步)</text>
  <text x="430" y="1304" font-size="7" fill="#2563eb">DynamicAnchor: A=max(128,L*0.1)</text>
  <text x="430" y="1318" font-size="7" fill="#52514e">physics_refine (Adam 100步)</text>
  <text x="430" y="1332" font-size="7" fill="#52514e">文件: scheme10_equivariant.py</text>
  <text x="430" y="1346" font-size="7" fill="#2563eb">类: StrictlyEquivariantS10</text>

  <!-- 维度链 -->
  <rect x="100" y="1380" width="600" height="30" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-opacity="0.2"/>
  <text x="400" y="1400" text-anchor="middle" font-size="8" fill="#1d4ed8">维度链: (B,L,640) → proj → (B,L,256) → GNN → (B,L,128)+(B,L,64,2) → Latent → (B,L,64)+(B,L,32,2) → Diffusion → (B,L,3)</text>

  <!-- 页脚 -->
  <text x="400" y="1430" text-anchor="middle" font-size="9" fill="#898781">RhoFold+ → S10 串联架构 | 2026-08-06 | confluencia_3_0</text>
</svg>
