version: "3.8"

services:
  confluencia-joint:
    build: .
    container_name: confluencia-joint
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0

  confluencia-drug:
    build: .
    container_name: confluencia-drug
    command: ["streamlit", "run", "confluencia-2.0-drug/app.py", "--server.port=8502", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0